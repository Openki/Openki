# image: registry.gitlab.com/openki/sysadmin/docker-ci-container:latest

workflow:
  rules:
    # Only run CI pipelines for specific branches and open merge requests.
    # This prevents duplicate CI pipelines for source branches in merge requests.
    - if: $CI_COMMIT_BRANCH =~ /^(dev|staging|main)$/ || $CI_MERGE_REQUEST_ID

stages:
  - prepare-ci-container
  - lint
  - cleanup
  - prepare
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .npm/
    - .meteor/

variables:
  DISPLAY: ":99.0"
  GIT_DEPTH: "0" # Full history needed for git describe / git log
  METEOR_ALLOW_SUPERUSER: "true"
  TOOL_NODE_FLAGS: "--max_old_space_size=4096"
  DEV_BRANCH: "dev"
  OPENKI_CI_IMAGE_TAG: registry.gitlab.com/openki/openki-ci:latest

# -------------------------------------------------------------------
# Stage: prepare-ci-container
# Rebuild the CI container - but only when ci/Dockerfile.ci changed
# -------------------------------------------------------------------
rebuild-ci-container:
  stage: prepare-ci-container
  rules:
    - changes:
        - ci/Dockerfile.ci
  image: docker:29.7.2-cli
  services:
    - docker:29.7.2-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Building CI container..."
    - docker build --tag $OPENKI_CI_IMAGE_TAG -f ci/Dockerfile.ci .
    - docker push $OPENKI_CI_IMAGE_TAG
  allow_failure: false

# Static analysis / formatting checks
lint:
  stage: lint
  image: $OPENKI_CI_IMAGE_TAG
  tags:
    - gitlab-org
  script: ./ci/lint.sh
  allow_failure: false

# Cleanup generated/cached dependencies
cleanup:
  stage: cleanup
  image: $OPENKI_CI_IMAGE_TAG
  script:
    - rm -rf .meteor/ .npm/ node_modules/

# -------------------------------------------------------------------
# Stage: prepare
# Runs ./ci/update-version.sh, writes server/version.js and build.env
# -------------------------------------------------------------------
prepare_version:
  stage: prepare
  image: $OPENKI_CI_IMAGE_TAG
  before_script:
    - git fetch --tags # Required for git describe to find annotated tags
  script:
    - bash ./ci/update-version.sh
  artifacts:
    reports:
      dotenv: build.env # Exposes IMAGE_TAG to downstream jobs
    paths:
      - server/version.js
    expire_in: 1 hour

# Unit / E2E / integration tests
test:
  stage: test
  image: $OPENKI_CI_IMAGE_TAG
  tags:
    - gitlab-org-docker
  variables:
    CYPRESS_RECORD_KEY: $CYPRESS_RECORD_KEY
  script: ./ci/test.sh

  # Do not fail the entire pipeline if tests fail.
  # Useful for unstable/flaky E2E tests.
  allow_failure: true
  timeout: 50m

# -------------------------------------------------------------------
# GitLab built-in code quality and SAST templates
# - Code Quality: runs Code Climate analysis
# - SAST: static application security testing
# -------------------------------------------------------------------
include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

# Code Quality configuration
code_quality:
  rules:
    # Disable job completely if CODE_QUALITY_DISABLED is set
    - if: $CODE_QUALITY_DISABLED
      when: never

    # Run only for merge requests targeting the "dev" branch
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $DEV_BRANCH
      when: always

# Semgrep SAST configuration
# - Additional SAST settings: https://gitlab.com/Openki/Openki/-/security/configuration/sast
semgrep-sast:
  rules:
    # Run security scanning only on the "dev" branch
    - if: "$CI_COMMIT_BRANCH == $DEV_BRANCH"
      when: always

# Global SAST settings
sast:
  variables:
    # Exclude generated/vendor directories from scanning
    SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS,.meteor/*,packages/*"

# -------------------------------------------------------------------
# Stage: build
# Builds and pushes the Docker image using the tag from prepare
# -------------------------------------------------------------------
build_and_push_docker:
  stage: build
  image: docker:29.7.2-cli
  services:
    - docker:29.7.2-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: prepare_version
      artifacts: true # Pulls in server/version.js + IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Building image with tag $IMAGE_TAG"
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

# -------------------------------------------------------------------
# Stage: Deploy
# -------------------------------------------------------------------

#Deploy branch dev
deploy_dev:
  stage: deploy
  # Start immediately after lint testing
  needs:
    - job: lint
    - job: prepare_version
      artifacts: true
    - job: build_and_push_docker
  variables:
    SOURCE_BRANCH: dev
    TARGET_HOST: dev
    IMAGE_TAG: $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  trigger: Openki/sysadmin/deploy-config

# Deploy staging branch
deploy_staging:
  stage: deploy
  needs:
    - job: prepare_version
      artifacts: true
    - job: build_and_push_docker
  variables:
    SOURCE_BRANCH: staging
    TARGET_HOST: openki-staging
    IMAGE_TAG: $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  trigger: Openki/sysadmin/deploy-config

# Deploy NLNet development branch
deploy_dev2:
  stage: deploy
  variables:
    SOURCE_BRANCH: dev
    TARGET_HOST: dev2
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  trigger: Openki/sysadmin/deploy-config

# Deploy main branch to sandbox
deploy_sandbox:
  stage: deploy
  needs:
    - job: prepare_version
      artifacts: true
    - job: build_and_push_docker
  variables:
    SOURCE_BRANCH: main
    TARGET_HOST: sandbox
    IMAGE_TAG: $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  trigger: Openki/sysadmin/deploy-config
