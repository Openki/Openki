image: registry.gitlab.com/openki/sysadmin/docker-ci-container:latest

# -------------------------------------------------------------------
# Global pipeline rules
#
# Run pipelines for:
# - Merge Requests
# - Branch pushes
# -------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH

stages:
  - build


cache:
  paths:
    - node_modules/
    - .npm/
    - .meteor/

variables:
  DISPLAY: ":99.0"

  # Reduce git traffic
  GIT_DEPTH: "10"

  METEOR_ALLOW_SUPERUSER: "true"

  # Increase Node.js memory limit
  TOOL_NODE_FLAGS: "--max_old_space_size=4096"


build_and_push_docker:
  stage: build  # <-- Matches the new stage above
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:test" .
    - docker push "$CI_REGISTRY_IMAGE:test"
  rules:
    - if: '$CI_COMMIT_BRANCH == "server-config-21-docker-simple-setup"'
      when: always
    - when: never
