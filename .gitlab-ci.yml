image: registry.gitlab.com/openki/sysadmin/docker-ci-container:latest

stages:
  - lint
  - cleanup
  - test
  - deploy

cache:
  paths:
    - node_modules/
    - .npm/
    - .meteor/

variables:
  DISPLAY: ":99.0"
  # Reduce git traffic
  GIT_DEPTH: "10"
  METEOR_ALLOW_SUPERUSER: "true"
  TOOL_NODE_FLAGS: "--max_old_space_size=4096"

cleanup:
  stage: cleanup
  script:
    - rm -rf .meteor/ .npm/ node_modules/

lint:
  stage: lint
  tags:
    - gitlab-org
  script: ./ci/lint.sh

# tests unit, e2e, ...
test:
  stage: test
  tags:
    - gitlab-org-docker
  variables:
    CYPRESS_RECORD_KEY: $CYPRESS_RECORD_KEY
  script: ./ci/test.sh
  allow_failure: true
  timeout: 50m

# Code Quality by "Code Climate" and SAST
include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

code_quality:
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"

semgrep-sast:                                          # More settings here: https://gitlab.com/Openki/Openki/-/security/configuration/sast
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

sast:
  variables:
    SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS,.meteor/*,packages/*"

#   Verify/Browser-Performance.gitlab-ci.yml

#browser_performance:
#  stage: test
#  variables:
#    URL: https://dev.openki.net

# auto deploy triggers
deploy_dev:
  stage: deploy
  needs: [] #don't wait for another stage to finish, could be change to [lint]
  variables:
    SOURCE_BRANCH: dev
    TARGET_HOST: dev
  only:
    - dev
  when: always
  trigger: Openki/sysadmin/deploy-config

deploy_staging:
  stage: deploy
  variables:
    SOURCE_BRANCH: staging
    TARGET_HOST: staging
  only:
    - staging
  when: always
  trigger: Openki/sysadmin/deploy-config

deploy_sandbox:
  stage: deploy
  variables:
    SOURCE_BRANCH: main
    TARGET_HOST: sandbox
  only:
    - main
  when: always
  trigger: Openki/sysadmin/deploy-config

