services:
  # ─────────────────────────────────────────────
  # Garage - S3-compatible object storage
  # ─────────────────────────────────────────────
  garages3:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_API_PORT:-3900}:3900" # S3 API (used by the app server)
      - "${GARAGE_WEB_PORT:-3902}:3902" # public web endpoint (used by the browser to load uploaded files)
      - "${GARAGE_ADMIN_PORT:-3903}:3903" # admin API
    networks:
      - app-network

  # One-shot: creates the "openki-dev" bucket + access key on first start.
  # Shares garages3's network namespace (so the CLI reaches it over localhost)
  # *and* its metadata volume (the CLI needs to read the node identity key
  # garages3 generates there on first boot to authenticate over RPC - without
  # it, `garage status` fails with "Unable to read node key"). Re-running is
  # safe, it skips steps already done.
  garages3-init:
    build:
      context: ./docker
      dockerfile: garage-init.Dockerfile
    depends_on:
      - garages3
    network_mode: "service:garages3"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
    restart: "no"

  # Caddy reverse proxy used to enable localhost SSL for development and testing
  # NOTE: Before the first run, use `just setup-localhost-ssl` to generate a SSL certificate.
  ssl-proxy:
    # By using a profile, this service will only download its image, build and get started
    # when running `docker compose --profile ssl up`.
    # This keeps the regular dev workflow simple, and only enables the proxy when needed.
    profiles:
      - ssl
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - ./docker/caddy:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config

volumes:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
