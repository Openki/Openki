<template name="eventPage">
	<div class="container">
		{{> event}}
	</div>
</template>

<template name="event">
	<div class="row">
		<div class="col-lg-8 mb-3">
			{{#if this.canceled}}
				<div class="alert alert-canceled text-center" role="alert">
					<strong>{{i18n 'event.canceled.alert' '{EVENT} got canceled.' EVENT=this.title}}</strong>
				</div>
			{{/if}}
			{{#if course}}
				{{#unless course.singleEvent}}
					{{> eventCourseHeader backlink=courseLink headerlink=courseLink regionId=region categories=categories title=course.name image=course.publicImageUrl}}
				{{else}}
					{{#if mayEdit}}
						{{> eventCourseHeader course=course backlink=courseLink regionId=region categories=categories title=title image=course.publicImageUrl}}
					{{else}}
						{{> eventCourseHeader course=course regionId=region categories=categories title=title image=course.publicImageUrl}}
					{{/if}}
				{{/unless}}
			{{/if}}
			<div class="event{{#if course}} course-event{{/if}}">
				{{#if editing}}
					{{> eventEdit}}
				{{else}}
					{{> eventDisplay}}
				{{/if}}
			</div>
		</div>
		{{#unless editing}}
			<div class="col-lg-4">
				{{> eventRegistration event=this}}
			</div>
		{{/unless}}
	</div>
	{{#if course.singleEvent}}
	<div class="row">
		<div class="col-lg-8 mb-3">
		{{> discussion courseId=course._id select=select}}
	</div>
</div>
	{{/if}}
</template>
