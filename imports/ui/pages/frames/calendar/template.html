<template name="frameCalendarPage">
	<style type="text/css">
		/* beautify ignore:start */
		{{#each cssRule in cssRules}}
			{{cssRule}}
		{{/each}}
		/* beautify ignore:end */

	</style>
	{{#each day in days}}
		<h4 class="frame-list-title">{{day}}</h4>
		{{#each event in (eventsOn day)}}
			{{> frameCalendarEvent event}}
		{{/each}}
	{{/each}}
	{{#if Template.subscriptionsReady}}
		{{#unless days}}
			<h2 class="mt-5 text-center">{{i18n 'frame.calendar.noEvents' 'No events planned'}}</h2>
		{{/unless}}
		{{#if moreEvents}}
			<div class="mt-2 text-center">
				<button class="btn btn-secondary js-show-more-events" type="button">
					{{i18n '_button.more'}}
				</button>
			</div>
		{{/if}}
	{{else}}
		{{> loadingRow}}
	{{/if}}
</template>

<template name="frameCalendarEvent">
	<div class="frame-list-item" style="{{#if canceled}}background-image:url('data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%20standalone%3D%22no%22%3F%3E %3C%21--%20Created%20with%20Inkscape%20%28http%3A%2F%2Fwww.inkscape.org%2F%29%20--%3E %3Csvg %20%20%20xmlns%3Asvg%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 %20%20%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 %20%20%20version%3D%221.0%22 %20%20%20width%3D%22100%22 %20%20%20height%3D%22100%22 %20%20%20id%3D%22svg8978%22%3E %20%20%3Cdefs %20%20%20%20%20id%3D%22defs8980%22%20%2F%3E %20%20%3Cg %20%20%20%20%20id%3D%22layer1%22%3E %20%20%20%20%3Cpath %20%20%20%20%20%20%20d%3D%22M%206.3895625%2C6.4195626%20C%2093.580437%2C93.610437%2093.580437%2C93.610437%2093.580437%2C93.610437%22 %20%20%20%20%20%20%20style%3D%22fill%3Anone%3Bfill-rule%3Aevenodd%3Bstroke%3A%23ff0000%3Bstroke-width%3A18.05195999%3Bstroke-linecap%3Abutt%3Bstroke-linejoin%3Amiter%3Bstroke-miterlimit%3A4%3Bstroke-dasharray%3Anone%3Bstroke-opacity%3A1%22 %20%20%20%20%20%20%20id%3D%22path8986%22%20%2F%3E %20%20%20%20%3Cpath %20%20%20%20%20%20%20d%3D%22M%206.3894001%2C93.6106%20C%2093.830213%2C6.4194003%2093.830213%2C6.4194003%2093.830213%2C6.4194003%22 %20%20%20%20%20%20%20style%3D%22fill%3Anone%3Bfill-rule%3Aevenodd%3Bstroke%3A%23ff0000%3Bstroke-width%3A17.80202103%3Bstroke-linecap%3Abutt%3Bstroke-linejoin%3Amiter%3Bstroke-miterlimit%3A4%3Bstroke-dasharray%3Anone%3Bstroke-opacity%3A1%22 %20%20%20%20%20%20%20id%3D%22path8988%22%20%2F%3E %20%20%3C%2Fg%3E %3C%2Fsvg%3E'); background-position: center; background-size: contain; background-repeat: no-repeat;{{/if}}">
		<h4 class="frame-list-item-header js-toggle-event-details">
			<span class="frame-list-item-toggle-indicator">
				<i class="fa-solid fa-angle-down"></i>
			</span>
			<div class="frame-list-free-seats" data-bs-toggle="tooltip" data-bs-title="{{#if isUnlimited}}
									{{i18n 'frame.list.reservation.status.unlimited.tooltip' '{RESERVEDSEATS} of unlimited seats reserved' RESERVEDSEATS=getAttendees}}
								{{else}}
									{{i18n 'frame.list.reservation.status.tooltip' '{RESERVEDSEATS} of {TOTALSEATS} seats reserved' RESERVEDSEATS=getAttendees TOTALSEATS=getTotalAvailableSeats}}
								{{/if}}">
				{{getAttendees}}/{{getTotalAvailableSeats}}
			</div>
			<i class="fa-solid fa-user frame-list-free-seats" aria-hidden="true"></i>

			<span class="frame-list-item-time">
				{{timeFormat start}}
			</span>
			<strong>{{title}}</strong>
			{{#if allRegions}}
				<span class="badge bg-primary frame-list-item-region">{{regionName}}</span>
			{{/if}}

		</h4>
		{{#if expanded}}
			<div class="p-2">
				<div class="row">
					<div class="col-4 col-sm-2">
						<strong>{{i18n 'frame.eventsList.when' 'When:'}}</strong>
					</div>
					<div class="col-8 col-sm-10">
						{{timeFormat start}} - {{timeFormat end}}
					</div>
				</div>
				<div class="row">
					<div class="col-4 col-sm-2">
						<strong>{{i18n 'frame.eventsList.where' 'Where:'}}</strong>
					</div>
					<div class="col-8 col-sm-10">
						{{#if venue._id}}
							<a href="{{pathFor 'venueDetails' _id=venue._id}}" target="_blank">
								{{venue.name}}
							</a>
						{{else}}
							{{venue.name}}
						{{/if}}
						{{#if room}}
							- {{room}}
						{{/if}}
					</div>
				</div>
				<div class="row">
					<div class="col-sm-2">
						<strong>{{i18n 'frame.eventsList.description' 'Description:'}}</strong>
					</div>
					<div class="col-sm-10">
						{{{description}}}
					</div>
				</div>
				<div class="mt-2 d-grid d-sm-flex">
					<a class="btn btn-outline-dark" href="{{pathFor 'showEvent'}}" target="_blank">
						{{i18n 'frame.calendar.moreAboutThisEvent' 'More about this event on {SITENAME}' SITENAME=siteName}}
					</a>
				</div>
			</div>
		{{/if}}
	</div>
</template>
