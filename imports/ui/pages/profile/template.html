<template name="profilePage">
  <div class="container mw-md">
    {{#unless isVisitor}}
      <div class="page-component">
        <h1>
          <span class="fa-solid fa-gears fa-fw" aria-hidden="true"></span>
          {{i18n 'login.frame.settings'}}
        </h1>
      </div>
    {{/unless}}
    {{#if notificationsUnsubscribeSuccess}}
      <div class="alert alert-success" role="alert">
        <span class="fa-stack fa-lg">
          <i class="fa-regular fa-envelope fa-stack-1x"></i>
          <i class="fa-solid fa-ban fa-stack-2x"></i>
        </span>
        {{i18n 'notifications.unsubscribeSuccess' 'You have unsubscribed from automated notifications.'}}
      </div>
    {{/if}}
    {{#if privateMessagesUnsubscribeSuccess}}
      <div class="alert alert-success" role="alert">
        <span class="fa-stack fa-lg">
          <i class="fa-regular fa-envelope fa-stack-1x"></i>
          <i class="fa-solid fa-ban fa-stack-2x"></i>
        </span>
        {{i18n 'privateMessages.unsubscribeSuccess' 'You will not get private messages from users.'}}
      </div>
    {{/if}}
    {{#if unsubscribeError}}
      <div class="alert alert-danger" role="alert">
        <span class="fa-stack fa-lg">
          <i class="fa-regular fa-envelope fa-stack-1x"></i>
          <i class="fa-solid fa-ban fa-stack-2x"></i>
        </span>
        {{i18n 'notifications.unsubscribeError' 'Could not unsubscribe. Please Try again.'}}
      </div>
    {{/if}}
    {{#unless currentUser}}
      {{i18n 'profile.not_logged_in' 'You are not logged in'}}
    {{else}}
      <div class="page-component">
        <div class="row g-3">
          <div class="col-6 col-sm-3">
            {{> avatarForm }}
          </div>

          <div class="col-sm-9">
            <h2 class="mt-4">
              {{> editable editableName}}
            </h2>

            <p>
              {{> editable editableDescription}}
            </p>

            <a class="btn btn-primary" href="{{pathFor 'userprofile' _id=currentUser._id}}">
              <span class="fa-solid fa-user fa-fw" aria-hidden="true"></span>
              {{i18n 'login.frame.profile' 'Public profile'}}
            </a>
          </div>
        </div>
      </div>

      {{#unless isVisitor}}

        {{#if user.email}}
          <div class="page-component page-component-seperated">
            <h3>{{i18n 'profile.email_settings' 'E-mail settings'}}</h3>
            <div class="row g-4 mb-2">
              <div class="col-sm-6">
                <form class="row g-2 mb-2 js-email-form">
                  <div class="col {{errorClass 'email'}}">
                    <label for="editform_email" class="sr-only">
                      {{i18n 'profile.email' 'E-mail'}}
                    </label>

                    <input class="form-control js-email" id="editform_email" type="text"
                           value="{{user.email}}" />
                    {{errorMessage 'email'}}
                  </div>
                  <div class="col-auto">
                    {{> buttonSave}}
                  </div>
                </form>
                {{#unless user.verified}}
                  {{> verifyEmail}}
                {{/unless}}
              </div>
              <div class="col-sm-6">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input js-notifications" type="checkbox" value=""
                         id="notificationsCheck" {{notificationsChecked}} />
                  <label class="form-check-label" for="notificationsCheck">
                    {{i18n 'profile.toggle.notifications' 'Receive automated notifications via e-mail'}}
                  </label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input js-allowPrivateMessages" type="checkbox" value=""
                         id="allowPrivateMessagesCheck" {{allowPrivateMessagesChecked}} />
                  <label class="form-check-label" for="allowPrivateMessagesCheck">
                    {{i18n 'profile.toggle.allowPrivateMessages' 'Receive private messages from users via e-mail'}}
                  </label>
                </div>
              </div>
            </div>
          </div>
        {{/if}}
        {{#if isAdmin}}
          <div class="page-component page-component-seperated">
            <h3>{{i18n 'profile.administration.title' 'Administration'}}</h3>
            <h5>
              {{i18n 'profile.administration.link' 'You are an administrator of {SITENAME}' SITENAME=PublicSettings.siteName }}
            </h5>
            <a class="button btn btn-primary" href="{{pathFor 'adminPanel'}}">
              {{i18n "profile.administration.button" "Visit admin panel" lng=locale}}
            </a>
          </div>
        {{/if}}
        {{#if tenantCount}}
          <div class="page-component page-component-seperated">
            <h3>{{i18n 'profile.tenants' 'My organizations'}}</h3>
            <h5>
              {{i18n 'profile.tenantMembership' 'You are {NUM_TENANTS, plural, =0{not admin of any organization} one{admin of the organization:} other{admin of # organizations:} }' NUM_TENANTS=tenantCount}}
            </h5>
            <ul class="list-unstyled">
              {{#each tenant in user.tenants}}
                <li class="mb-3">
                  <div class="tag tag-link tenant-tag">
                    <a href="{{pathFor 'tenantDetails' _id=tenant._id}}">
                      {{tenant.name}}
                    </a>
                  </div>
                </li>
              {{/each}}
            </ul>
          </div>
        {{/if}}
        <div class="page-component page-component-seperated">
          <h3>{{i18n 'profile.groups' 'My groups'}}</h3>
          <h5>
            {{i18n 'profile.groupMembership' 'You are {NUM_GROUPS, plural, =0{not member of any group} one{member of the group:} other{member of # groups:} }' NUM_GROUPS=groupCount}}
          </h5>
          <ul class="list-unstyled">
            {{#each group in user.groups}}
              <li class="mb-3">{{> groupTag groupId=group._id full=true}}</li>
            {{/each}}
          </ul>
          <a class="btn btn-add" href="{{pathFor 'groupDetails' _id='create'}}">
            {{i18n 'profile.createNewGroup.button' 'Create a new group'}}
          </a>
        </div>
        <div class="page-component page-component-seperated profile-venues-list">
          <h3>{{i18n 'profile.venues' 'My venues:'}}</h3>
          {{#if isVenueEditor}}
            <ul class="list-unstyled">
              {{#each venue in user.venues}}
                <li class="mb-3">{{> venueLink venue=venue}}</li>
              {{/each}}
            </ul>
          {{else}}
            <p>{{i18n 'userprofile.noOwnVenues' "You're not an editor of any venue."}}</p>
          {{/if}}
          <a class="btn btn-add" href="{{pathFor 'venueDetails' _id='create'}}">
            {{i18n 'profile.createNewVenue.button' 'Create a new venue'}}
          </a>
        </div>

      {{else}}
        <div class="page-component page-component-seperated">
          <h3>{{i18n 'profile.createUser.title' 'Create user'}}</h3>
          <p>{{i18n 'profile.createUser.description' 'You are currently here as a guest user. If you want to be able to log in again later or from an other device, you can create a normal user account here. For this, we will send you an email with the instructions and a link to set a password for your account.'}}
          </p>

          <a class="button btn btn-primary"
             href="{{pathFor 'resetPasswortEmail' email=user.email}}">
            {{i18n "profile.createUser.button" "Send me an account creation email" lng=locale}}
          </a>
        </div>
      {{/unless}}

      <div class="page-component page-component-seperated">
        <h3>{{i18n 'profile.danger_zone' 'Danger zone'}}</h3>

        {{#unless isVisitor}}
          <div class="mb-3">
            {{#unless changingPass}}
              <button type="button" class="btn btn-secondary js-change-pwd-btn">
                {{i18n 'profile.changePass' 'Change my password'}}
              </button>
            {{/unless}}
            {{#if changingPass}}
              <div class="border border-success text-primary p-3">
                <form class="js-change-pwd">
                  <div class="row mb-2">
                    <label for="oldpassword" class="col-sm-4 col-form-label text-end">
                      {{i18n 'profile.input.oldPassword' 'Your current password'}}
                    </label>
                    <div class="col-sm-8">
                      <input type="password" class="js-old-pwd form-control" id="oldpassword"
                             value="" />
                    </div>
                  </div>
                  <div class="row mb-2">
                    <label for="newpassword" class="col-sm-4 col-form-label text-end">
                      {{i18n 'profile.input.newPassword' 'New password'}}
                    </label>
                    <div class="col-sm-8">
                      <input type="password" class="js-new-pwd form-control" id="newpassword"
                             value="" />
                    </div>
                  </div>
                  <div class="row mb-2">
                    <label for="newpassword_confirm" class="col-sm-4 col-form-label text-end">
                      {{i18n 'profile.input.repeatPassword' 'Repeat new password'}}
                    </label>
                    <div class="col-sm-8">
                      <input type="password" class="js-new-pwd-confirm form-control"
                             id="newpassword_confirm" value="" />
                    </div>
                  </div>
                  <div class="d-flex gap-2 justify-content-end">
                    {{> buttonSave}}
                    {{> buttonCancel event="js-change-pwd-cancel"}}
                  </div>
                </form>
              </div>
            {{/if}}
          </div>
        {{/unless}}
        <div>
          {{> deleteConfirm deleteConfirmAttr}}
        </div>
      </div>
    {{/unless}}
  </div>
</template>
