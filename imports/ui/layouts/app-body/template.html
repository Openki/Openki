<template name="layout">
  {{> root}}
  {{#unless isResetPasswordEmailSent}}
    {{#if showRegionSplash}}
      {{> regionSplash}}
    {{/if}}
  {{/unless}}
  {{> accountTasks}}
  <div id="wrap">
    <div id="topBar">
      {{> navbar}}
    </div>
    <div id="outer" class="{{#if PublicSettings.testWarning}}test-warning{{/if}}">

      {{> yield region='aboveContent'}}

      {{#if isResetPasswordEmailSent}}
        <div id="maincontent">
          {{> resetPasswordEmailSent}}
        </div>
      {{else}}


        {{> alerts}}

        {{> emailValidation}}

        <div id="maincontent">
        {{> introduction hasPricePolicy=hasPricePolicy}}
          {{#if isAdminPage}}
            <div class="container mw-md">
              <h1>{{i18n 'adminPanel.heading' 'Admin panel'}}</h1>
              {{#if isAdmin}}
                {{#if isNotAdminPanel}}
                  <a href="{{pathFor 'adminPanel'}}" class="admin-back-to-dashboard">
                    <i class="fa-solid fa-chevron-left fa-fw"></i>
                    {{i18n 'adminPanel.backToDashboard' 'Go back to dashboard'}}
                  </a>
                {{/if}}
                <div class="mt-3">
                  {{> yield}}
                </div>
              {{else}}
                {{i18n 'adminPanel.pleaseLogin' 'Only for administrators'}}
              {{/if}}
            </div>
          {{else}}
            {{> yield}}
          {{/if}}
        </div>

      {{/if}}
    </div>
    <div class="push"></div>
  </div>
  {{> kioskLink}}
  {{> footer}}
</template>
