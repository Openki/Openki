<template name="visitorFrame">
	<form>
		<div class="mb-3 {{errorClass 'email'}}">
			<div class="input-group">
				<span class="input-group-text">
					<span class="fa-solid fa-envelope fa-fw" aria-hidden="true"></span>
				</span>
				<input class="form-control js-email"
					   placeholder="{{i18n 'frame.visitor.email' 'E-Mail' attr=true}}"
					   type="email" />
			</div>
			{{errorMessage 'email'}}
		</div>
		<div class="mb-3">
			{{i18n 'login.frame.visitor.mailDisclaimer' 'Providing an e-mail address allows use to notify you eg. about new events.'}}
		</div>
		<div class="mb-3">
			<button type="submit" class="btn btn-add form-control js-visitor" {{disabledIfBusy}}>
				{{#if busy 'registering'}}
					<span class="fa-solid fa-circle-notch fa-spin fa-fw" aria-hidden="true"></span>
					{{i18n 'login.visitor.submit.busy' 'Registering…'}}
				{{else}}
					{{i18n 'login.visitor.submit'}}
				{{/if}}
			</button>
		</div>
		<hr>
		<div class="mb-3">
			<button class="js-back-to-login btn btn-secondary form-control" type="button">
				{{i18n 'login.visitor.backToLogin' 'Go back to login'}}
			</button>
		</div>
	</form>
</template>
