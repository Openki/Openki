<template name="eventDisplay">
	<div class="page-component">
		{{#if mayEdit}}
			{{#if singleEvent}}
				<nav>
					<ul class="nav nav-tabs" role="tablist">
						<li class="nav-item" role="presentation">
							<button class="nav-link active" id="description-tab"
									data-bs-toggle="tab" data-bs-target="#description" type="button"
									role="tab" aria-controls="description" aria-selected="true">
								<span class="fa-solid fa-file-lines fa-fw"
									  aria-hidden="true"></span>
								<span
									  class="tab-label">{{i18n 'course.subnav.descr' 'Description'}}</span>
							</button>
						</li>
						<li class="nav-item" role="presentation">
							<button class="nav-link" id="files-tab" data-bs-toggle="tab"
									data-bs-target="#files" type="button" role="tab"
									aria-controls="files" aria-selected="false">
								<span class="fa-solid fa-file fa-fw" aria-hidden="true"></span>
								<span
									  class="tab-label">{{i18n 'course.subnav.files' 'Files'}}</span>
							</button>
						</li>
					</ul>
				</nav>
				<div class="tab-content b-none">
					<div class="tab-pane mh-none overflow-visible active" id="description"
						 role="tabpanel" aria-labelledby="description-tab" tabindex="0">
						{{> eventContent}}
					</div>
					<div class="tab-pane" id="files" role="tabpanel" aria-labelledby="files-tab"
						 tabindex="0">
						<div class="p-3">
							{{> courseFiles course=course}}
						</div>
					</div>
				</div>
			{{else}}
				{{> eventContent}}
			{{/if}}
		{{else}}
			{{> eventContent}}
		{{/if}}
		{{#if replicating}}
			{{> eventReplication}}
		{{/if}}
		{{#if mayEdit}}
			{{#if expanded}}
				{{> deleteConfirmDialog deleteConfirmDialogAttr}}
			{{else}}
				{{#unless replicating}}
					<div class="actions">
						{{> buttonEdit event="js-event-edit"}}
						<button type="button" class="btn btn-edit js-show-replication">
							{{i18n 'event.details.repl_menu_btn' 'Repeat'}}
						</button>
						<a class="btn btn-edit js-download js-track-cal-download"
						   href="{{pathFor 'calEvent' this}}"
						   title="{{i18n 'event.detail.download_cal' 'Download event to my calendar' attr=true}}">
							{{i18n 'event.details.download' 'Download'}}
						</a>
						{{> buttonDelete event="js-expand"}}
					</div>
				{{/unless}}
			{{/if}}
		{{/if}}
	</div>
</template>
