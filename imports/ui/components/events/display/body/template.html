<template name="eventDisplay">
	<div class="page-component">
		{{#if courseId}}
			{{> eventHeader start=startLocal end=endLocal}}
		{{else}}
			{{> eventHeader regionId=this.region start=startLocal end=endLocal}}
		{{/if}}
		<div class="details-body event-details-body">
			<div class="details-content">
				{{#if internal}}
					{{> internalIndicator}}
				{{/if}}
				<div class="row">
					<div class="col-md-7">
						<h3>{{this.title}}</h3>

						{{> eventGroupList this}}
						<p class="event-details-description">
							{{{description}}}
						</p>

						{{#each info in customFields}}
							<p>
								<strong>{{info.displayText}}</strong>: <span
									  style="white-space: pre-line;">{{info.value}}</span>
							</p>
						{{/each}}
					</div>
					<div class="col-md-5">
						<div class="details-map">
							{{#if hasVenue}}
								{{> map markers=eventMarkers}}
							{{/if}}

							<div class="tag-group multiline mt-1">
								{{> venueLink venue=venue room=room}}
							</div>
							{{#if venue.address}}
								<div class="tag">
									<span class="fa-solid fa-location-dot fa-fw"
										  aria-hidden="true"></span>
									{{venue.address}}
								</div>
							{{/if}}
						</div>
					</div>
				</div>
			</div>
			{{#unless isPrivate}}
				{{> pricePolicy dismissable=true wrap='event-details-price-policy'}}
				{{> sharing}}
			{{/unless}}
		</div>
		{{#if replicating}}
			{{> eventReplication}}
		{{/if}}
		{{#if mayEdit}}
			{{#if expanded}}
				{{> deleteConfirmDialog deleteConfirmDialogAttr}}
			{{else}}
				{{#unless replicating}}
					<div class="actions">
						{{> buttonEdit event="js-event-edit"}}
						<button type="button" class="btn btn-edit js-show-replication">
							{{i18n 'event.details.repl_menu_btn' 'Repeat'}}
						</button>
						<a class="btn btn-edit js-download js-track-cal-download"
						   href="{{pathFor 'calEvent' this}}"
						   title="{{i18n 'event.detail.download_cal' 'Download event to my calendar' attr=true}}">
							{{i18n 'event.details.download' 'Download'}}
						</a>
						{{> buttonDelete event="js-expand"}}
					</div>
				{{/unless}}
			{{/if}}
		{{/if}}
	</div>
</template>
