<template name="eventRegistration">
	<div class="col-lg-4">
		{{#if isFuture}}
			<div class="page-component">
				<div class="event-page-component-header">
					<h4>
						{{i18n 'event.details.registration' 'Registration'}}
					</h4>
				</div>
			</div>
			<div class="page-component">
				<b>
					{{#unless userRegisteredForEvent}}
						{{i18n 'event.details.i-participate-no' 'Let it be known you are participating in this event. Your registration is binding.'}}
					{{else}}
						{{i18n 'event.details.i-participate-yes' 'You are now registered. Your registration is binding.'}}
					{{/unless}}
				</b>
			</div>
			<div
				 class="page-component {{#if anyDropdown}} pt-3 px-3 event-detail-register-dropdown{{/if}}">
				{{#unless userRegisteredForEvent}}
					{{#if acceptsParticipants}}
						{{#unless registerDropdown}}
							{{> buttonBeforeRegister event="js-before-register-event"}}
						{{else}}
							<p>
								{{i18n 'event.details.want-to-register' 'Do you want to reserve a seat as {USERNAME} for the event "{EVENTTITLE}" on the {DATE}? Your reservation is binding.' USERNAME=userName EVENTTITLE=title DATE=(dateFormat startLocal) attr=true}}
							</p>
							<p>
							<div class="row justify-content-between align-items-center">
								<div class="col-lg-4 d-grid">
									{{> buttonCancel event="js-register-event-cancel"}}
								</div>
								<div class="col-lg-7 d-grid">
									{{> buttonRegister event="js-register-event"}}
								</div>
							</div>
							</p>
						{{/unless}}
					{{else}}
						{{> buttonRegistrationClosed}}
					{{/if}}
				{{else}}
					{{#unless unregisterDropdown}}
						{{> buttonBeforeUnregister event="js-before-unregister-event"}}
					{{else}}
						<p>
							{{i18n 'event.details.want-to-withdraw' 'Do you want to withdraw your registration for the event "{EVENTTITLE}" on the {DATE}?' EVENTTITLE=title DATE=eventDate}}
						</p>
						<p>
						<div class="row justify-content-between align-items-center">
							<div class="col-lg-4 d-grid">
								{{> buttonCancel event="js-unregister-event-cancel"}}
							</div>
							<div class="col-lg-7 d-grid">
								{{> buttonUnregister event="js-unregister-event"}}
							</div>
						</div>
						</p>
						{{#if courseTitle}}
							<p>
								{{i18n 'event.details.youStayEnrolled' 'Note that you will stay enrolled as interested for {COURSETITLE}.' COURSETITLE=courseTitle}}
							</p>
						{{/if}}
					{{/unless}}
				{{/unless}}
			</div>
		{{/if}}
		<div class="page-component">
			{{> eventParticipants}}
		</div>
		<div class="page-component">
			{{> report}}
		</div>
	</div>
</template>

<template name="buttonBeforeRegister">
	<button type="button" class="btn btn-add btn-event {{event}}" {{disabledIfBusy}}>
		{{i18n 'event.details.reserve-a-seat' 'Reserve a seat'}}
	</button>
</template>

<template name="buttonRegister">
	<button type="button" class="btn btn-add btn-event text-center {{event}}" {{disabledIfBusy}}>
		{{#if busy 'registering'}}
			<span class="fa-solid fa-circle-notch fa-spin fa-fw" aria-hidden="true"></span>
			{{i18n '_button.registering' 'Registering…'}}
		{{else}}
			{{i18n 'event.details.register-register' 'Register'}}
		{{/if}}
	</button>
</template>

<template name="buttonRegistrationClosed">
	<button type="button" class="btn btn-warning btn-event {{event}}" {{disabledIfBusy}}>
		{{#if busy 'registering'}}
			<span class="fa-solid fa-circle-notch fa-spin fa-fw" aria-hidden="true"></span>
			{{i18n '_button.addingYouToWaitingQueue' 'Adding you to waiting queue…'}}
		{{else}}
			{{i18n 'event.details.isFullyBooked' 'The event is fully booked'}}
		{{/if}}
	</button>
</template>

<template name="buttonBeforeUnregister">
	<button type="button" class="btn btn-add btn-event {{event}}" {{disabledIfBusy}}>
		{{i18n 'event.details.withdraw-registration' 'Withdraw my registration'}}
	</button>
</template>

<template name="buttonUnregister">
	<button type="button" class="btn btn-danger btn-event text-center {{event}}" {{disabledIfBusy}}>
		{{#if busy 'unregistering'}}
			<span class="fa-solid fa-circle-notch fa-spin fa-fw" aria-hidden="true"></span>
			{{i18n '_button.unregistering' 'Unregistering…'}}
		{{else}}
			{{i18n 'event.details.unregister-withdraw' 'Withdraw'}}
		{{/if}}
	</button>
</template>
