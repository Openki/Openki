<template name="discussion">
  {{! style fixes a problem that occurs during the transition to react. This can be removed when everything is changed to react. }}
  <div class="page-component discussion" id="discussion" style="margin-top: 15px;">
    <div class="page-component-header">
      <h4>
        <span class="fa-solid fa-comments fa-fw" aria-hidden="true"></span>&nbsp;
        {{i18n 'course.title.Discussion' 'Discussion'}}
      </h4>
    </div>
    {{#if Template.subscriptionsReady}}
      {{> post newPost}}
      {{#each p in posts}}
        <div class="discussion-conversation">
          {{> post p}}
        </div>
      {{/each}}
      {{#if limited}}
        <button class="btn btn-add page-component-btn js-show-all-posts" type="button">
          <i class="fa-solid fa-chevron-down fa-fw" aria-hidden="true"></i>
          {{i18n 'course.discussions.showAllComment' 'Show all {NUM} comments' NUM=count}}
        </button>
      {{/if}}
    {{else}}
      {{> loadingRow}}
    {{/if}}
  </div>
</template>
