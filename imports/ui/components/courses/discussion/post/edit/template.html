<template name="postEdit">
  <div class='{{postClass}} {{#if new}}{{#unless parentId}}discussion-post-new{{/unless}}{{/if}}'>
    {{> discussionProfileIcon userId=userId}}
    <div class="discussion-edit-content">
      <form>
        <div class="discussion-edit-header">
          {{#if showUserId}}
            {{> discussionProfileLink userId=userId}}
          {{else}}
            <strong>{{i18n 'discussion.anonymous' 'Anonymous'}}</strong>
          {{/if}}
          {{#unless new}}
            <span class="discussion-post-header-sub">
              <span data-bs-toggle="tooltip" data-bs-title="{{dateFormat time_created attr=true}}">
                {{fromNow time_created}}
              </span>
              {{#if notifyAll}}
                <i class="fa-solid fa-bell" aria-hidden="true" data-bs-toggle="tooltip"
                   data-bs-title="{{i18n 'course.discussion.allNotified' 'All interested notified' attr=true}}"></i>
              {{/if}}
              {{#if hasBeenEdited}}
                -
                {{i18n 'course.discussion.lastUpdate' 'Last update'}}:
                <span data-bs-toggle="tooltip"
                      data-bs-title="{{dateFormat time_updated attr=true}}">
                  {{fromNow time_updated}}
                </span>
              {{/if}}
            </span>
          {{/unless}}
        </div>
        <div class="discussion-edit-body">
          <div class="mb-3">
            <input class="js-post-title discussion-edit-title form-control form-control-lg"
                   type="text"
                   placeholder="{{i18n 'course.discussion.title_placeholder' 'Title' attr=true}} {{i18n '_inputField.optional' attr=true}}"
                   value="{{title}}" />
          </div>
          <div class="mb-3">
            {{> richtext richtextAttr}}
          </div>
          {{#if new}}
            {{#if canNotifyAll}}
              <div class="form-check">
                <input class="form-check-input js-notify-all" type='checkbox' {{notifyAllChecked}}
                       value="" id="canNotifyAllCheck">
                <label class="form-check-label" for="canNotifyAllCheck">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  {{i18n 'course.discussion.notifyAll' 'Notify all interested'}}
                </label>
              </div>
            {{/if}}
            <div class="form-check">
              <input class='form-check-input toggleAnonymous js-anon' type='checkbox'
                     {{anonChecked}} {{anonDisabled}} id="anonymousCheck" />
              <label class="form-check-label discussion-toggle-anonymous" for="anonymousCheck">
                <i class="fa-solid fa-user-secret" aria-hidden="true"></i>
                {{i18n 'course.discussion.anon' 'Anonymous comment'}}
              </label>
            </div>
          {{/if}}
          <div class="form-actions">
            <button type="submit" class="btn btn-save discussion-save-btn" {{disabledIfBusy}}
                    {{enableWhenValid}}>
              <span class="fa-solid fa-paper-plane fa-fw" aria-hidden="true"></span>
              {{#if new}}
                {{#if parentId}}
                  {{i18n 'course.discussion.comment_btn.answer' 'Answer'}}
                {{else}}
                  {{i18n 'course.discussion.comment_btn.write' 'Write'}}
                {{/if}}
              {{else}}
                {{i18n 'course.discussion.comment_btn.update' 'Update my comment'}}
              {{/if}}
            </button>
            {{> buttonCancel event="js-discussion-cancel"}}
          </div>
        </div>
      </form>
    </div>
  </div>
</template>
