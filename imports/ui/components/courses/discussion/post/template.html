<template name="post">
  {{#if editing}}
    {{> postEdit this}}
  {{else}}
    {{> postShow this}}
  {{/if}}
  {{#if notAllResponsesShown}}
    <button class="mt-3 btn btn-link p-0 toggle-all-responses js-show-previous-replies"
            type="button">
      {{i18n 'course.discussions.showPreviousReplies' 'Show all previous answers'}}
    </button>
  {{/if}}
  {{#each response in responses}}
    {{> post response}}
  {{/each}}
  {{#if allowResponse}}
    {{> post newResponse}}
  {{/if}}
</template>
