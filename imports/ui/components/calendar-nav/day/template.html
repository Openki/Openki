<template name="calendarNavDay">
	<div class="calendar-nav-container">
		<div class="row justify-content-center align-items-center py-1">
			{{> calendarNavDayControl direction='previous'}}
			<div class="col-auto">
				<div class="lead">
					<span class="d-none d-md-inline-block">{{dateLong date}}</span>
					<span class="d-md-none">{{dateShort date}}</span>
				</div>
				<div>
					{{i18n "calendar.weekNumber" "Week"}} {{weekNr date}}
				</div>
			</div>
			{{> calendarNavDayControl direction='next'}}
		</div>
	</div>
</template>

<template name="calendarNavDayControl">
	<div class="col-auto px-4">
		<button type="button" class="btn btn-secondary js-change-date">
			{{arrow}} <span class="d-none d-md-inline-block">{{text direction 'short'}}</span>
		</button>
	</div>
</template>

<template name="calendarNavDayDynamicTranslations">
	This template holds translation strings that are constructed dynamically in this component

	{{i18n 'calendar.previous.day.short' 'previous day'}}
	{{i18n 'calendar.next.day.short' 'next day'}}
</template>
