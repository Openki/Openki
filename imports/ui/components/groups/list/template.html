<template name="groupName">
	<div class="tag tag-link group-tag {{#if isOrganizer}}group-tag-is-organizer{{/if}}">
		<a class="js-group-label group-{{groupId}}" href="{{pathFor 'groupDetails' _id=groupId}}"
		   data-bs-toggle="tooltip"
		   data-bs-title="{{i18n 'groupList.show_courses' '{NAME}, show all their courses' NAME=(name groupId) attr=true}}">
			{{short groupId}}
		</a>
	</div>
</template>

<template name="groupNameFull">
	<div class="tag tag-link group-tag">
		<a class="js-group-label" href="{{pathFor 'groupDetails' _id=groupId}}" data-html="true"
		   data-bs-toggle="tooltip"
		   data-bs-title="{{i18n 'groupList.show_courses' NAME=(name groupId) attr=true}}">
			{{name groupId}}
		</a>
	</div>
</template>
