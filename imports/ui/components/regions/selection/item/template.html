<template name="regionSelectionItem">
  <li class="{{private}}">
    <a href="#"
       class="dropdown-item js-region-link js-nav-dropdown-close {{#if isCurrentRegion _id}}fw-bold{{/if}}"
       title="{{nameEn}}">
      <div class="dropdown-addon-right">
        <span class="badge bg-primary rounded-pill"
              title="{{i18n 'regions.courses.title' '{COUNT, plural, =0{no courses} one{one course} other{# courses in} } in {REGION}' COUNT=courseCount REGION=this.name attr=true}}">
          {{courseCount}}
        </span>
        <span class="badge bg-success text-dark rounded-pill"
              title="{{i18n 'regions.eventCount.title' '{COUNT, plural, =0{no upcoming events} one{one upcoming event} other{# upcoming events} } in {REGION}' COUNT=futureEventCount REGION=this.name attr=true}}">
          {{futureEventCount}}
        </span>
      </div>
      {{#if isCurrentRegion _id}}
        <span class="checkmark fa-solid fa-check"></span>
      {{/if}}
      {{regionNameMarked}}
    </a>
  </li>
</template>
