<template name="report">
	{{#if sending}}
		{{i18n 'report.sending' 'Report is being sent…'}}
	{{/if}}
	{{#if reporting}}
		<div class="report p-3">
			<form class="js-report-send needs-validation" novalidate>
				<div class="mb-3">
					<label class="form-label"
						   for="reportMessage">{{i18n 'report.text' 'Please tell us what is wrong.'}}</label>
					<textarea class="js-report-message form-control" id="reportMessage" rows="3"
							  placeholder="{{i18n 'report.placeholder' 'My hovercraft is full of eels.' attr=true}}"
							  required minlength="5"></textarea>
					<div class="invalid-feedback">
						{{i18n 'report.warning.tooShort' 'The report message is too short! Please write more than 5 characters.'}}
					</div>
				</div>
				<div class="d-flex gap-2 justify-content-end">
					<button type="submit" class='btn btn-save'>
						<span class="fa-solid fa-paper-plane fa-fw" aria-hidden="true"></span>
						{{i18n 'report.report' 'Send report'}}
					</button>
					{{> buttonCancel event="js-report-cancel"}}
				</div>
			</form>
		</div>
	{{else}}
		<button type="button" class="btn btn-secondary js-report">
			{{i18n 'report.open' 'Report problem'}}
		</button>
	{{/if}}
</template>
