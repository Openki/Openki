services:
  # ─────────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────────
  mongo:
    # This image's real entrypoint (a compiled binary, not the docker-entrypoint.py
    # you'll find if you `docker run --entrypoint cat ... /usr/local/bin/docker-entrypoint.py`,
    # that file is unused) unconditionally refuses to start on Linux kernel 6.19+
    # (TCMalloc/glibc rseq ABI issue, see MongoDB SERVER-121912) - there's no env
    # var that bypasses it despite what some threads claim. We skip that wrapper
    # entirely and run mongod directly instead, which starts fine (verified: it
    # accepts connections and answers queries on kernel 7.0.10). This also means
    # MONGODB_INITDB_ROOT_USERNAME/PASSWORD-style env vars won't do anything here,
    # since the wrapper that reads those is exactly what we're bypassing.
    image: ${MONGO_IMAGE:-mongodb/mongodb-community-server:4.4-ubuntu2204-slim}
    entrypoint: ["mongod"]
    command: ["--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Garage - S3-compatible object storage
  # ─────────────────────────────────────────────
  garages3:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    volumes:
      - ./docker/garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_API_PORT:-3900}:3900" # S3 API (used by the app server)
      - "${GARAGE_WEB_PORT:-3902}:3902" # public web endpoint (used by the browser to load uploaded files)
      - "${GARAGE_ADMIN_PORT:-3903}:3903" # admin API
    networks:
      - app-network

  # One-shot: creates the "openki-dev" bucket + access key on first start.
  # Shares garages3's network namespace (so the CLI reaches it over localhost)
  # *and* its metadata volume (the CLI needs to read the node identity key
  # garages3 generates there on first boot to authenticate over RPC - without
  # it, `garage status` fails with "Unable to read node key"). Re-running is
  # safe, it skips steps already done.
  garages3-init:
    build:
      context: ./docker
      dockerfile: garage-init.Dockerfile
    depends_on:
      - garages3
    network_mode: "service:garages3"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
    restart: "no"

  # ─────────────────────────────────────────────
  # Meteor app (dev mode, hot code reload + debugger)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.env
    restart: unless-stopped
    depends_on:
      - mongo
      - garages3-init
    ports:
      - "${APP_PORT:-3000}:3000" # app
      - "${APP_INSPECT_PORT:-9229}:9229" # node --inspect debugger
    environment:
      ROOT_URL: ${ROOT_URL:-http://localhost:3000}
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/openki
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: node_modules
        target: /app/node_modules
      - type: bind
        source: .meteor
        target: /app/.meteor
    networks:
      - app-network

volumes:
  mongo-data:
  garage-meta:
  garage-data:
  app-node-modules:
  app-meteor:

networks:
  app-network:
    driver: bridge
